name: civicroute
description: AI-Powered Intelligent Government Complaint Routing and Resolution System - Client.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Client Integration
  supabase_flutter: ^2.5.8

  # HTTP request client
  http: ^1.2.1

  # Geolocator for GPS fetching
  geolocator: ^11.0.0

  # Audio recording for speech complaints
  record: ^5.1.2

  # Image picker for photos
  image_picker: ^1.1.2


  # OpenStreetMap widget
  flutter_map: ^6.1.0

  # State management
  provider: ^6.1.2

  # Extra standard flutter packages
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
