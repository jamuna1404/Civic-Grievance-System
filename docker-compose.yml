version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: civicroute_db
    environment:
      - POSTGRES_DB=civic
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civic"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: civicroute_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/civic
      - SUPABASE_URL=https://mockproject.supabase.co
      - SUPABASE_KEY=mock-anon-key
      - SUPABASE_SERVICE_ROLE_KEY=mock-service-role-key
      - JWT_SECRET=mock-jwt-secret-key-for-local-token-verification
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Seeding database automatically on clean containers startup before running backend server
    command: >
      sh -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
